name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7
        with:
          version: v0.11.2
          neovim: true
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check .
      - name: Run clean unit tests
        run: |
          nvim --clean --headless -l tests/spring_project.lua
          nvim --clean --headless -l tests/root_detection.lua
          nvim --clean --headless -l tests/task_output.lua
          nvim --clean --headless -l tests/health.lua
      - name: Cache pinned Lazy and Mason data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/xdg/data/nvim/lazy
            ${{ runner.temp }}/xdg/data/nvim/mason
          key: required-bootstrap-${{ runner.os }}-${{ hashFiles('lazy-lock.json') }}
      - name: Bootstrap pinned plugins and verify startup
        id: bootstrap
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg/config
          XDG_DATA_HOME: ${{ runner.temp }}/xdg/data
          XDG_STATE_HOME: ${{ runner.temp }}/xdg/state
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg/cache
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim"
          nvim --headless -u init.lua "+Lazy! sync" +qa
          nvim --headless -u init.lua +qa
      - name: Print bootstrap versions on failure
        if: failure()
        run: |
          nvim --version || true
          stylua --version || true
          git -C "${RUNNER_TEMP}/xdg/data/nvim/lazy/lazy.nvim" describe --always --dirty 2>/dev/null || true
          sed -n '1,120p' lazy-lock.json
      - name: Upload bootstrap logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-bootstrap-logs
          path: |
            nvim.log
            ${{ runner.temp }}/xdg/cache
          if-no-files-found: ignore
      - name: Check repository whitespace
        run: git diff --check

  java-integration:
    name: Java integration
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7
        with:
          version: v0.11.2
          neovim: true
      - name: Cache Java bootstrap data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .ci-data/nvim/lazy
            .ci-data/nvim/mason
          key: java-tools-${{ runner.os }}-${{ hashFiles('lazy-lock.json') }}
      - name: Bootstrap plugins and Java tools
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config
          XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
          XDG_STATE_HOME: ${{ runner.temp }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim"
          nvim --headless -u init.lua "+Lazy! sync" +qa
          timeout 720 nvim --headless -u init.lua -l .github/scripts/install-java-tools.lua
      - name: Run advisory Java smoke test
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config
          XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
          XDG_STATE_HOME: ${{ runner.temp }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: timeout 180 nvim --headless -u init.lua -l tests/java_spring_smoke.lua
      - name: Explain advisory failure
        if: failure()
        run: |
          echo "Java integration is advisory (continue-on-error=true); inspect this job's failed step and artifact logs."
          nvim --version || true
          java -version || true
      - name: Upload Java logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: java-integration-logs
          path: |
            nvim.log
            .ci-data
            ${{ runner.temp }}/cache
          if-no-files-found: ignore
